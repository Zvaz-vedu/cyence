baseURL = 'https://cyence.org/'
title = 'CYENCE'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
removePathAccents = true
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  organizer = 'Zvaž vědu!, z. s.'
  organizerURL = 'https://zvazvedu.cz'
  email = 'info@zvazvedu.cz'
  dateStart = 2027-09-05
  dateEnd = 2027-09-12

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-GB'
    weight = 1
    title = 'CYENCE – Czech Youth Expo & Conference'
    [languages.en.params]
      description = 'An international science competition and conference for young researchers aged 15–20. Brno, 5–12 September 2027.'
  [languages.cs]
    label = 'Čeština'
    locale = 'cs-CZ'
    weight = 2
    title = 'CYENCE – Czech Youth Expo & Conference'
    [languages.cs.params]
      description = 'Mezinárodní soutěž a konference pro mladé výzkumníky ve věku 15–20 let. Brno, 5.–12. září 2027.'

