[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.extensions.typographer]
  disable = false

# Tailwind v4: Hugo writes the classes it sees in templates to hugo_stats.json,
# which Tailwind scans; the cachebuster rebuilds CSS when that file changes.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

# Czech URLs for sections (single pages use `slug` in their content/cs file).
[languages.cs.permalinks.page]
  about = '/o-akci/:slug/'
  projects = '/projekty/:contentbasename/'
  news = '/aktuality/:slug/'
[languages.cs.permalinks.section]
  about = '/o-akci/'
  projects = '/projekty/'
  news = '/aktuality/'

[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

# Content per language: content/en and content/cs hold the same file names;
# pages with the same path are each other's translations.
[[module.mounts]]
  source = 'content/en'
  target = 'content'
  [module.mounts.sites.matrix]
    languages = ['en']
[[module.mounts]]
  source = 'content/cs'
  target = 'content'
  [module.mounts.sites.matrix]
    languages = ['cs']
# Projects live in /projects (one file each, in English) and are shown on
# both language sites.
[[module.mounts]]
  source = 'projects'
  target = 'content/projects'
  [module.mounts.sites.matrix]
    languages = ['en', 'cs']
