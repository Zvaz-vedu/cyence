# Hugo comes from the hugo-extended npm package (pinned in package.json),
# so Netlify and local builds always use the same version.
[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[context.deploy-preview]
  command = "npm run build -- --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm run build -- -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS file names contain a content hash, so they never change.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Domains: cyence.org is the main address. The other domains must be added
# to the Netlify site as domain aliases; these rules then send them on.
# cyence.cz goes to the Czech version, cyence.eu to the same page on .org.
[[redirects]]
  from = "https://cyence.cz/*"
  to = "https://cyence.org/cs/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cyence.cz/*"
  to = "https://cyence.org/cs/"
  status = 301
  force = true

[[redirects]]
  from = "https://cyence.eu/*"
  to = "https://cyence.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cyence.eu/*"
  to = "https://cyence.org/:splat"
  status = 301
  force = true

# Renamed and removed pages.
[[redirects]]
  from = "/public-day/*"
  to = "/roadshow/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/cs/verejny-den/*"
  to = "/cs/roadshow/:splat"
  status = 301
  force = true

# Roadshow cities that are not confirmed (yet).
[[redirects]]
  from = "/roadshow/ostrava/*"
  to = "/roadshow/"
  status = 302
  force = true

[[redirects]]
  from = "/roadshow/ceske-budejovice/*"
  to = "/roadshow/"
  status = 302
  force = true

[[redirects]]
  from = "/cs/roadshow/ostrava/*"
  to = "/cs/roadshow/"
  status = 302
  force = true

[[redirects]]
  from = "/cs/roadshow/ceske-budejovice/*"
  to = "/cs/roadshow/"
  status = 302
  force = true

[[redirects]]
  from = "/cs/*"
  to = "/cs/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
