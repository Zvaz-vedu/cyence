- name: news
  label: News
  icon: newspaper
  folder: content/news
  create: true
  i18n: true
  slug: '{{slug}}'
  sortable_fields:
  - date
  - title
  summary: '{{date | date(''D. M. YYYY'')}} · {{title}}'
  fields:
  - name: title
    label: Title
    widget: string
    i18n: true
  - name: date
    label: Date
    widget: datetime
    time_format: false
    format: YYYY-MM-DD
    i18n: duplicate
  - name: category
    label: Category
    widget: select
    options:
    - label: News
      value: news
    - label: Event
      value: event
    - label: Press release
      value: press
    i18n: duplicate
  - name: summary
    label: Summary (on the card)
    widget: text
    i18n: true
  - name: link
    label: Link instead of an article page
    widget: string
    i18n: true
    required: false
    hint: A page path such as /apply or /about/event (works in both languages), or a full URL. Used when the text below is
      empty.
  - name: cta
    label: Link label (e.g. Register)
    widget: string
    i18n: true
    required: false
  - name: body
    label: Article text (optional)
    widget: markdown
    buttons:
    - bold
    - italic
    - link
    - bulleted-list
    - numbered-list
    - heading-two
    - heading-three
    - quote
    editor_components: []
    i18n: true
    required: false
- name: projects
  label: Projects
  icon: science
  folder: projects
  create: true
  slug: '{{slug}}'
  sortable_fields:
  - title
  - country
  - field
  summary: '{{title}} · {{country}}'
  fields:
  - name: title
    label: Title
    widget: string
  - name: students
    label: Students
    widget: list
    field:
      name: name
      label: Name
      widget: string
  - name: country
    label: Country
    widget: select
    options:
