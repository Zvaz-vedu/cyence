{{- /* Key numbers in quarters. Context: dict "page" "s" */ -}}
<section class="wrap pt-section">
  {{ with .s.title }}<h2 class="sr-only">{{ . }}</h2>{{ end }}
  <ul class="grid-12">
    {{ range .s.items }}
      <li class="col-span-6 border-t-2 border-ink pt-5 lg:col-span-3" data-reveal>
        <p class="display text-d-md lg:text-d-lg">{{ .value }}</p>
        <p class="mt-3 max-w-xs">{{ .label }}</p>
      </li>
    {{ end }}
  </ul>
</section>
