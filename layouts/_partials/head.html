<meta charset="utf-8">
<script>document.documentElement.classList.add("js")</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ $title := cond .IsHome site.Title (printf "%s · CYENCE" .Title) }}
<title>{{ $title }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">
<meta name="color-scheme" content="light only">
{{ if .Params.noindex }}<meta name="robots" content="noindex, nofollow">{{ end }}
<meta name="theme-color" content="#f2ede6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
{{ if eq .Language.Lang "en" }}<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">{{ end }}
{{ end }}
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:type" content="{{ cond .IsHome "website" "article" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:locale" content="{{ replace site.Language.Locale "-" "_" }}">
<link rel="preload" href="/fonts/zv-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/zv-regular.woff2" as="font" type="font/woff2" crossorigin>
{{ with (templates.Defer (dict "key" "global")) }}
  {{ partial "css.html" . }}
{{ end }}
