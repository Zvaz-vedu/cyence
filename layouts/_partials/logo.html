{{- /* Inline CYENCE logo (assets/images/logo.svg – generated by
       design/logo/build.py). Context: dict "class" (string) */ -}}
{{- with resources.Get "images/logo.svg" -}}
  {{- $svg := replaceRE `^\s*<svg ` (printf `<svg class="%s" role="img" aria-label="CYENCE – Czech Youth Expo &amp; Conference" ` ($.class | default "")) .Content 1 -}}
  {{- $svg | safeHTML -}}
{{- end -}}
