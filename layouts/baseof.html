<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}"{{ with site.GetPage "/play" }} data-play="{{ .RelPermalink }}"{{ end }}>
<head>
  {{ partial "head.html" . }}
</head>
<body class="flex min-h-dvh flex-col">
  <a href="#main" class="btn btn-primary sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50">{{ T "skipToContent" }}</a>
  {{ partial "header.html" . }}
  <main id="main" class="flex-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "js.html" . }}
</body>
</html>
